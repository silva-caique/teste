<!DOCTYPE html>
<html lang="pt">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>App Teste Idosos</title>

    <link rel="manifest" href="manifest.json">
    <meta name="theme-color" content="#28a745">

    <style>
        body {
            font-family: Arial, sans-serif;
            text-align: center;
            padding: 30px 15px;
            background-color: #f4f4f9;
        }

        h1 {
            font-size: 28px;
            color: #333;
        }

        .btn {
            background-color: #28a745;
            color: white;
            font-size: 20px;
            font-weight: bold;
            padding: 18px 30px;
            border: none;
            border-radius: 12px;
            cursor: pointer;
            margin: 10px 0;
            width: 100%;
            max-width: 320px;
            box-shadow: 0 4px 8px rgba(0, 0, 0, 0.2);
        }

        .btn-notif {
            background-color: #0056b3;
        }
    </style>
</head>

<body>

    <h1>👴 App de Apoio</h1>
    <p>Testes de Acessibilidade e Notificação</p>

    <!-- Botão de Notificação estilo WhatsApp -->
    <button class="btn btn-notif" onclick="dispararNotificacao()">🔔 RECEBER NOTIFICAÇÃO</button>

    <br>

    <!-- Botão de Voz -->
    <button class="btn" onclick="testarVoz()">🔊 OUVIR INSTRUÇÃO</button>

    <script>
        // Pedir permissão para enviar notificações assim que abre
        if ('Notification' in window) {
            Notification.requestPermission();
        }

        // Função que manda a notificação real para o telemóvel
        function dispararNotificacao() {
            if (!('Notification' in window)) {
                alert('Este telemóvel não suporta notificações.');
                return;
            }

            Notification.requestPermission().then(permission => {
                if (permission === 'granted') {
                    alert('A notificação vai sair daqui a 4 segundos! Minimiza o aplicativo AGORA.');

                    setTimeout(() => {
                        if (navigator.serviceWorker.controller) {
                            // Envia o comando para o sw.js disparar o aviso
                            navigator.serviceWorker.controller.postMessage({
                                type: 'NOTIFICACAO',
                                titulo: '💊 HORA DO MEDICAMENTO',
                                corpo: 'Está na hora de tomar 1 comprimido de Paracetamol.'
                            });
                        }
                    }, 4000);
                } else {
                    alert('A permissão foi negada. Precisas de ativar as notificações nas definições do Chrome/Telemóvel.');
                }
            });
        }
        // Função de áudio
        function testarVoz() {
            if ('speechSynthesis' in window) {
                const mensagem = new SpeechSynthesisUtterance("Olá! O teste da aplicação funcionou com sucesso.");
                mensagem.lang = 'pt-PT';
                window.speechSynthesis.speak(mensagem);
            }
        }

        // Registo do Service Worker
        if ('serviceWorker' in navigator) {
            navigator.serviceWorker.register('sw.js');
        }
    </script>
</body>

</html>

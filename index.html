<!DOCTYPE html>
<html lang="pt">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>App Teste Idosos</title>

    <link rel="manifest" href="manifest.json">
    <meta name="theme-color" content="#28a745">

    <style>
        body {
            font-family: Arial, sans-serif;
            text-align: center;
            padding: 30px 15px;
            background-color: #f4f4f9;
        }

        h1 {
            font-size: 28px;
            color: #333;
        }

        .btn {
            background-color: #28a745;
            color: white;
            font-size: 20px;
            font-weight: bold;
            padding: 18px 30px;
            border: none;
            border-radius: 12px;
            cursor: pointer;
            margin: 10px 0;
            width: 100%;
            max-width: 320px;
            box-shadow: 0 4px 8px rgba(0, 0, 0, 0.2);
        }

        .btn-notif {
            background-color: #0056b3;
        }
    </style>
</head>

<body>

    <h1>👴 App de Apoio</h1>
    <p>Testes de Acessibilidade e Notificação</p>

    <!-- Botão de Notificação estilo WhatsApp -->
    <button class="btn btn-notif" onclick="dispararNotificacao()">🔔 RECEBER NOTIFICAÇÃO</button>

    <br>

    <!-- Botão de Voz -->
    <button class="btn" onclick="testarVoz()">🔊 OUVIR INSTRUÇÃO</button>

    <script>
        // Pedir permissão para enviar notificações assim que abre
        if ('Notification' in window) {
            Notification.requestPermission();
        }

        // Função que manda a notificação real para o telemóvel
        function dispararNotificacao() {
            if ('Notification' in window && Notification.permission === 'granted') {

                // Simular um atraso de 3 segundos para dar tempo de minimizar a app se quiseres
                setTimeout(() => {
                    navigator.serviceWorker.ready.then(registration => {
                        registration.showNotification("💊 HORA DO MEDICAMENTO", {
                            body: "Está na hora de tomar 1 comprimido de Paracetamol.",
                            icon: "https://cdn-icons-png.flaticon.com/512/3074/3074058.png",
                            vibrate: [200, 100, 200], // Fazer o telemóvel vibrar
                            tag: "lembrete-remedio"
                        });
                    });
                }, 3000);

                alert("A notificação vai aparecer em 3 segundos! Se quiseres, podes minimizar a app para ver o banner a cair no ecrã.");
            } else {
                alert("Por favor, permite as notificações no aviso que aparece no ecrã!");
            }
        }

        // Função de áudio
        function testarVoz() {
            if ('speechSynthesis' in window) {
                const mensagem = new SpeechSynthesisUtterance("Olá! O teste da aplicação funcionou com sucesso.");
                mensagem.lang = 'pt-PT';
                window.speechSynthesis.speak(mensagem);
            }
        }

        // Registo do Service Worker
        if ('serviceWorker' in navigator) {
            navigator.serviceWorker.register('sw.js');
        }
    </script>
</body>

</html>
